<div class="column" style="--gap: 0.5lh;" data-signals="{held: 0}"><div class="card column" style="--gap: 0.5lh;"><strong>hold-confirm</strong> <small style="--fg: -0.55;">static/rocket/hold-confirm.js — the line-item destructive idiom: hold until the trace completes, a bubbling `confirm` fires on landing. Click does nothing; an accidental tap costs nothing.</small><fieldset data-on:confirm="$held = $held + 1"><hold-confirm class="dgr" data-ignore-morph hold="900"><button type="button" class="sec">Hold me</button></hold-confirm></fieldset><small style="--fg: -0.6;">confirms landed: <span data-text="$held"></span></small></div></div>
