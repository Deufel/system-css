<div class="column" style="--gap: 0.5lh;" data-signals="{picked: {}}"><div class="card column" style="--gap: 0.5lh;"><strong>element-pick</strong> <small style="--fg: -0.55;">static/rocket/element-pick.js — a click starts a pick, a highlight follows the pointer, a click names the element and a bubbling `picked` carries {sel, role, aria, text, box}; Escape cancels. The feedback HUD stores it beside the report.</small><fieldset data-on:picked="$picked = evt.detail"><element-pick data-ignore-morph><button type="button" class="sec">Pick an element</button></element-pick></fieldset><small style="--fg: -0.6;">picked: <code data-text="JSON.stringify($picked)"></code></small></div></div>
